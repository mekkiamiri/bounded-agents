name: ci

on:
  push:
    branches: [main]
    tags: ["cfp-*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Domaine, outils, frontières (ArchUnit) et scénarios
        run: mvn -B verify
